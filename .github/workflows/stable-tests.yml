name: Stable tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  practice-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run stable practice-site tests
        run: npx cucumber-js --tags "@practice"
        env:
          CI: 'true'

      - name: Build Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            allure-report
            allure-results